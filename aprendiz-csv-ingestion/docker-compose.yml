version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aprendiz-postgres
    environment:
      POSTGRES_DB: aprendiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aprendiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  aprendiz-app:
    build: .
    container_name: aprendiz-csv-ingestion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aprendiz
      DB_USER: postgres
      DB_PASSWORD: password
      FLASK_DEBUG: "False"
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aprendiz-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  aprendiz-network:
    driver: bridge
